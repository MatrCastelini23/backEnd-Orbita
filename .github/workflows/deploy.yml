name: Deploy Back-end Local

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: [self-hosted, prod-back]

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Criar arquivo .env e Executar Build Local
      run: |
        # Configura as portas para PRODUÇÃO no Ubuntu Server
        export DOCKER_TARGET_BACK=prod
        export BACK_PORT=9000
        export BACK_CONTAINER_PORT=9000
        export NGINX_BACK_PORT=8000        # <--- Porta de acesso externa da API
        export NGINX_CONTAINER_PORT=80     # <--- Porta interna do Nginx do Back

        # Escreve o arquivo .env de produção que o container do Laravel lerá internamente
        echo "APP_ENV=production" > .env
        echo "APP_DEBUG=false" >> .env
        echo "DB_CONNECTION=mysql" >> .env
        echo "DB_HOST=db" >> .env             # <--- Aponta para o nome do serviço no compose
        echo "DB_DATABASE=laravel_prod" >> .env
        echo "DB_USERNAME=laravel_user" >> .env
        echo "DB_PASSWORD=senha_segura_producao" >> .env
        echo "DB_ROOT_PASSWORD=senha_root_ultra_segura" >> .env

        # Derruba execuções anteriores limpando conflitos
        docker compose --profile production down || true
        docker rm -f backend-container mysql-container nginx-backend || true

        # Reconstrói a imagem do Laravel localmente no servidor
        docker compose --profile production build --no-cache backend

        # Inicia o ecossistema com o perfil de produção ativo (inclui o Nginx do back na porta 8000)
        docker compose --profile production up -d backend db nginx

        # Aguarda o MySQL inicializar as tabelas antes de aplicar as migrations
        sleep 12
        docker exec backend-container php artisan migrate --force
