name: Deploy Back-end

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: [self-hosted, prod-back]
    environment: production

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Build da imagem de produção (local, sem push)
      run: docker build --target prod -t meu-projeto-backend:prod .

    - name: Gerar .env de produção
      run: |
        cat > ~/app-backend/.env <<EOT
        APP_ENV=${{ vars.APP_ENV }}
        APP_DEBUG=${{ vars.APP_DEBUG }}
        DB_HOST=db
        DB_DATABASE=${{ secrets.DB_DATABASE }}
        DB_USERNAME=${{ secrets.DB_USERNAME }}
        DB_PASSWORD=${{ secrets.DB_PASSWORD }}
        BACK_PORT=${{ vars.BACK_PORT }}
        NGINX_BACK_PORT=${{ vars.NGINX_BACK_PORT }}
        EOT
        chmod 600 ~/app-backend/.env

    - name: Gerar secret da senha do banco (arquivo, fora do .env)
      run: |
        mkdir -p ~/app-backend/secrets
        printf '%s' "${{ secrets.DB_PASSWORD }}" > ~/app-backend/secrets/db_password.txt
        chmod 600 ~/app-backend/secrets/db_password.txt

    - name: Atualizar Ambiente e Rodar Migrations
      run: |
        # Entra na pasta fixa da infraestrutura de produção no Ubuntu Server
        cd ~/app-backend
        # Sobe/recria backend e nginx usando a imagem recem-buildada localmente
        docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile production up -d --force-recreate backend nginx db
        # Executa as migrations do banco de dados automaticamente dentro do novo container
        docker exec backend-container php artisan migrate --force
