name: Deploy Back-end Local

on:
    push:
        branches: [ "main" ]

jobs:
    build-and-deploy:
        runs-on: [ self-hosted, prod-back ]

        steps:
            - name: Checkout do código
              uses: actions/checkout@v4

            - name: Criar arquivo .env e Executar Build Local
              run: |
                  # Configura as variáveis para o Dockerfile saber que deve rodar o build de produção
                  export DOCKER_TARGET_BACK=prod
                  export BACK_PORT=8000
                  export NGINX_BACK_PORT=8000

                  # Escreve o arquivo .env de produção que o Laravel e o MySQL vão ler
                  echo "APP_ENV=production" > .env
                  echo "APP_DEBUG=false" >> .env
                  echo "DB_CONNECTION=mysql" >> .env
                  echo "DB_HOST=db" >> .env
                  echo "DB_DATABASE=laravel_prod" >> .env
                  echo "DB_USERNAME=laravel_user" >> .env
                  echo "DB_PASSWORD=senha_segura_producao" >> .env
                  echo "DB_ROOT_PASSWORD=senha_root_ultra_segura" >> .env

                  # Reconstrói a imagem do back-end localmente no servidor sem puxar de registro externo
                  docker compose --profile production build --no-cache backend

                  # Inicia todo o ambiente de produção
                  docker compose --profile production up -d --force-recreate backend db nginx

                  # Executa as migrations do Laravel
                  sleep 10
                  docker exec backend-container php artisan migrate --force
