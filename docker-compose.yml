version: '3.8'

services:
    backend:
        build:
            context: .
            target: dev
        volumes:
            - .:/var/www
        ports:
            - "8000:8000"
        environment:
            - DB_HOST=db
            - DB_DATABASE=laravel_db
            - DB_USERNAME=root
            - DB_PASSWORD=root
        depends_on:
            - db

    db:
        image: mysql:8.0
        ports:
            - "3306:3306"
        environment:
            MYSQL_DATABASE: laravel_db
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - mysql_data:/var/lib/mysql

volumes:
    mysql_data:
